name: Build latest (manual)

# Manual, no schedule.
#   Run workflow -> resolve newest upstream release (pre-releases included, or the
#   ref you type) -> apply the TempRoot patch -> build with YOUR keystore at build
#   time (so `app-release.apk` AND its embedded `assets/stub.apk` share one key)
#   -> publish a (pre-)release with the APK, the flashable Magisk package, the
#   complete source archive and LICENSE.
#
# Why signing must happen inside the build:
#   Magisk derives `trusted_cert` from the `stub.apk` that magiskinit unpacks from
#   the boot ramdisk (native/src/init/rootdir.cpp). That stub is the one embedded
#   in the app's assets at build time (app/core/.../assets/stub.apk), and the
#   daemon compares the manager APK's signature with it (native/src/core/package.rs).
#   Post-signing only the APK with apksigner leaves the embedded stub signed with
#   the old key -> "signature mismatch" -> magiskd uninstalls the manager.
#   Passing keyStore/keyAlias/... through config.prop signs both, consistently.
#
# Secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS (key0)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream tag or branch (empty = newest release incl. pre-release)"
        required: false
        default: ""
      prerelease:
        description: "Publish as pre-release"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-latest
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    env:
      KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'key0' }}
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - name: Check out the fork (for tools/)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: "recursive"

      - name: Resolve the upstream ref
        id: ref
        run: |
          set -e
          REF="${{ inputs.ref }}"
          if [ -z "$REF" ]; then
            API="https://api.github.com/repos/topjohnwu/Magisk/releases?per_page=20"
            REF=$(curl -fsSL "$API" | jq -r '[.[] | select(.draft | not)][0].tag_name // empty')
            if [ -z "$REF" ]; then
              REF=$(curl -fsSL "$API" | python3 -c 'import json,sys; d=[x for x in json.load(sys.stdin) if not x.get("draft")]; print(d[0]["tag_name"] if d else "")')
            fi
          fi
          [ -n "$REF" ] || REF=master
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Building upstream ref: $REF"

      - name: Check out upstream at that ref
        run: |
          set -e
          cp -r tools "$RUNNER_TEMP/tools"
          git remote add upstream https://github.com/topjohnwu/Magisk.git
          git fetch --depth 1 upstream "${{ steps.ref.outputs.ref }}"
          git checkout -B build FETCH_HEAD
          mkdir -p tools
          cp -r "$RUNNER_TEMP/tools/." tools/
          # Magisk vendors cxx-rs and quick-protobuf as git submodules
          # (native/src/external/*). Without this the Rust build dies with
          # "failed to read .../cxx-rs/Cargo.toml".
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Apply the TempRoot patch
        run: python3 tools/temp_root_patch.py .

      - name: Show the applied diff
        run: git diff --stat

      - name: Write config.prop (signing keys live only here)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          {
            echo "abiList=arm64-v8a,armeabi-v7a,x86,x86_64"
            if [ -n "$KEYSTORE_BASE64" ]; then
              KS="$RUNNER_TEMP/keystore.jks"
              printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KS"
              echo "keyStore=$KS"
              echo "keyStorePass=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPass=$KEY_PASSWORD"
              echo "signing enabled"
            else
              echo "::warning::KEYSTORE_BASE64 not set - Magisk falls back to the debug key."
            fi
          } > config.prop
          sed 's/^keyStorePass=.*/keyStorePass=***/; s/^keyPass=.*/keyPass=***/' config.prop

      - name: Set up the build environment (upstream action)
        uses: ./.github/actions/setup
        with:
          is-asset-build: true

      - name: Build release
        run: ./build.py -c config.prop -vr all

      - name: Stop the gradle daemon
        run: ./app/gradlew --stop || true

      - name: Verify the signature of the app and of its embedded stub
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BT=$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1)
          APP=$(ls out/app-release.apk out/app-debug.apk 2>/dev/null | head -1)
          echo "== $APP =="
          "$BT/apksigner" verify --print-certs "$APP" | grep -E 'Signer #1 certificate (DN|SHA-256)' || true
          rm -rf /tmp/stubchk && mkdir -p /tmp/stubchk
          unzip -o -q "$APP" assets/stub.apk -d /tmp/stubchk || echo "no embedded stub"
          if [ -f /tmp/stubchk/assets/stub.apk ]; then
            echo "== embedded assets/stub.apk =="
            "$BT/apksigner" verify --print-certs /tmp/stubchk/assets/stub.apk |
              grep -E 'Signer #1 certificate (DN|SHA-256)' || true
            echo "^^ both SHA-256 lines must be identical, otherwise the manager will be removed."
          fi

      - name: Collect release files
        id: payload
        run: |
          set -e
          SHA=$(git rev-parse --short HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          cp out/app-*.apk dist/ 2>/dev/null || true
          cp out/magisk-*.apk dist/ 2>/dev/null || true
          cp out/magisk-*.zip dist/ 2>/dev/null || true
          git archive --format=tar.gz --prefix="Magisk-$SHA/" -o "dist/source-$SHA.tar.gz" HEAD
          cp LICENSE dist/LICENSE || true
          ls -l dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          SHA="${{ steps.payload.outputs.sha }}"
          REF="${{ steps.ref.outputs.ref }}"
          TAG="temp-root-$REF-$(date -u +%Y%m%d)"
          FLAGS=""
          [ "${{ inputs.prerelease }}" = "true" ] && FLAGS="--prerelease"
          gh release create "$TAG" dist/* $FLAGS \
            --target master \
            --title "TempRoot Magisk $REF ($SHA)" \
            --notes "Unofficial GPL-3.0 build based on upstream Magisk \`$REF\`.

          Changes: \"Uninstall Magisk\" hidden, Magisk core Install/Update hidden,
          manager update kept.

          Signed with the maintainer key at build time, so \`app-release.apk\` and
          the \`assets/stub.apk\` embedded in it share one certificate - required
          for magiskd to trust the manager.

          **This only removes the uninstall loop if the running Magisk core was
          installed from this same build (the boot image embeds this stub).**
          With an officially patched boot image the daemon still expects the
          official certificate.

          Source: \`source-$SHA.tar.gz\` (complete corresponding source).
          Upstream: https://github.com/topjohnwu/Magisk"
